<style>
/* ==========================================================================
   Мир единоборств — общая дизайн-система (шапка, кнопки, типографика, подвал,
   перекраска тильдовских попапов T702). Все классы с префиксом .me-, чтобы
   не конфликтовать со стилями Tilda.
   ========================================================================== */

:root {
  --me-ground: #0b0b0c;
  --me-ground-2: #141416;
  --me-ground-3: #1c1c1f;
  --me-line: rgba(243, 239, 232, 0.14);
  --me-line-strong: rgba(243, 239, 232, 0.32);
  --me-paper: #f3efe8;
  --me-muted: #aaa49b;
  --me-red: #d11f16;
  --me-red-hot: #ff4d40;
  --me-red-deep: #a8170f;

  --me-display: "Oswald", "Arial Narrow", sans-serif;
  --me-body: "Golos Text", "Segoe UI", Roboto, sans-serif;

  --me-ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --me-ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);

  --me-gutter: clamp(16px, 4vw, 56px);
  --me-max: 1440px;
  --me-header-h: 72px;
}

.me, .me *, .me *::before, .me *::after { box-sizing: border-box; }

.me {
  background: var(--me-ground);
  color: var(--me-paper);
  font-family: var(--me-body);
  font-size: 17px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: clip;
}
.me :where(img) { display: block; max-width: 100%; }
.me :where(a) { color: inherit; text-decoration: none; }
.me :where(button) { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.me :where(h1, h2, h3, h4, p, ul, ol, figure, blockquote, dl, dd) { margin: 0; padding: 0; }
.me :where(ul, ol) { list-style: none; }
.me ::selection { background: var(--me-red); color: #fff; }

.me :focus-visible {
  outline: 2px solid var(--me-red-hot);
  outline-offset: 3px;
  border-radius: 2px;
}

html { scrollbar-color: #3a3a3f var(--me-ground); }
body { background: var(--me-ground); }

.me-wrap {
  width: 100%;
  max-width: var(--me-max);
  margin-inline: auto;
  padding-inline: var(--me-gutter);
}

.me-visually-hidden {
  position: absolute !important; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}

/* ---------- Typography ---------- */
.me-display {
  font-family: var(--me-display);
  font-weight: 700;
  text-transform: uppercase;
  line-height: 0.9;
  letter-spacing: -0.01em;
}
.me-h2 {
  font-family: var(--me-display);
  font-weight: 700;
  text-transform: uppercase;
  font-size: clamp(44px, 7.2vw, 96px);
  line-height: 0.92;
  letter-spacing: -0.01em;
  text-wrap: balance;
}
.me-h3 {
  font-family: var(--me-display);
  font-weight: 600;
  text-transform: uppercase;
  font-size: clamp(26px, 2.6vw, 36px);
  line-height: 1;
}
.me-lead { font-size: clamp(18px, 1.5vw, 21px); line-height: 1.5; color: var(--me-paper); max-width: 46ch; }
.me-muted { color: var(--me-muted); }
.me-red { color: var(--me-red-hot); }

/* ---------- Buttons ---------- */
.me-btn {
  --btn-bg: var(--me-red);
  --btn-fg: #fff;
  position: relative;
  display: inline-flex; align-items: center; justify-content: center; gap: 12px;
  min-height: 56px; padding: 0 30px;
  background: var(--btn-bg); color: var(--btn-fg);
  font-family: var(--me-display); font-weight: 600; font-size: 19px;
  letter-spacing: 0.04em; text-transform: uppercase;
  border-radius: 4px;
  isolation: isolate; overflow: hidden;
  transition: transform 160ms var(--me-ease-out), background-color 200ms ease, box-shadow 200ms ease;
  box-shadow: 0 12px 28px -14px rgba(0, 0, 0, 0.8);
}
.me-btn::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: var(--me-red-deep);
  clip-path: inset(0 100% 0 0);
  transition: clip-path 380ms var(--me-ease-out);
}
.me-btn svg { width: 20px; height: 20px; transition: transform 300ms var(--me-ease-out); }
.me-btn:active { transform: scale(0.97); }
@media (hover: hover) and (pointer: fine) {
  .me-btn:hover::before { clip-path: inset(0 0 0 0); }
  .me-btn:hover svg { transform: translateX(4px); }
}
.me-btn--lg { min-height: 68px; padding: 0 40px; font-size: 22px; }
@media (max-width: 560px) { .me-btn--lg { min-height: 62px; padding: 0 24px; font-size: 19px; } }
.me-btn { white-space: nowrap; }
.me-btn--ghost {
  --btn-bg: transparent; --btn-fg: var(--me-paper);
  box-shadow: inset 0 0 0 1.5px var(--me-line-strong);
}
.me-btn--ghost::before { background: var(--me-paper); }
@media (hover: hover) and (pointer: fine) {
  .me-btn--ghost:hover { color: var(--me-ground); }
}
.me-btn--paper { --btn-bg: var(--me-paper); --btn-fg: var(--me-ground); box-shadow: none; }
.me-btn--paper::before { background: #fff; }

.me-link {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--me-display); font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.05em; font-size: 17px;
  background: linear-gradient(currentColor, currentColor) 0 100% / 0 1.5px no-repeat;
  padding-bottom: 4px;
  transition: background-size 360ms var(--me-ease-out), color 200ms ease;
}
.me-link svg { width: 18px; height: 18px; transition: transform 300ms var(--me-ease-out); }
@media (hover: hover) and (pointer: fine) {
  .me-link:hover { background-size: 100% 1.5px; }
  .me-link:hover svg { transform: translateX(4px); }
}

/* Arrow buttons for rails */
.me-arrows { display: flex; gap: 10px; }
.me-arrow {
  width: 56px; height: 56px; border-radius: 50%;
  display: grid; place-items: center;
  box-shadow: inset 0 0 0 1.5px var(--me-line-strong);
  transition: background-color 200ms ease, color 200ms ease, transform 160ms var(--me-ease-out), opacity 200ms ease;
}
.me-arrow svg { width: 22px; height: 22px; }
.me-arrow:active { transform: scale(0.94); }
.me-arrow[disabled] { opacity: 0.3; cursor: default; }
@media (hover: hover) and (pointer: fine) {
  .me-arrow:not([disabled]):hover { background: var(--me-paper); color: var(--me-ground); }
}

/* ---------- Header ---------- */
.me-header {
  position: fixed; inset: 0 0 auto 0; z-index: 900;
  height: var(--me-header-h);
  transition: background-color 300ms ease, box-shadow 300ms ease, transform 400ms var(--me-ease-out);
}
.me-header.is-solid {
  background: rgba(11, 11, 12, 0.92);
  -webkit-backdrop-filter: saturate(140%) blur(14px);
  backdrop-filter: saturate(140%) blur(14px);
  box-shadow: 0 1px 0 var(--me-line);
}
.me-header.is-hidden { transform: translateY(-100%); }
.me-header__in {
  height: 100%; display: flex; align-items: center; gap: 28px;
  max-width: var(--me-max); margin-inline: auto; padding-inline: var(--me-gutter);
}
.me-header__logo { flex: none; display: block; }
.me-header__logo img { height: 40px; width: auto; }
.me-nav { display: flex; gap: 22px; margin-right: auto; }
.me-nav a {
  font-size: 15px; font-weight: 500; color: var(--me-paper); opacity: 0.82;
  padding: 6px 0; position: relative; white-space: nowrap;
  transition: opacity 200ms ease;
}
.me-nav a::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
  background: var(--me-red); transform: scaleX(0); transform-origin: left;
  transition: transform 300ms var(--me-ease-out);
}
.me-nav a[aria-current="page"] { opacity: 1; }
.me-nav a[aria-current="page"]::after { transform: scaleX(1); }
@media (hover: hover) and (pointer: fine) {
  .me-nav a:hover { opacity: 1; }
  .me-nav a:hover::after { transform: scaleX(1); }
}
.me-header__side { display: flex; align-items: center; gap: 20px; flex: none; }
.me-header__franchise { font-size: 14px; color: var(--me-muted); white-space: nowrap; transition: color 200ms ease; }
@media (hover: hover) and (pointer: fine) { .me-header__franchise:hover { color: var(--me-paper); } }
.me-header .me-btn { min-height: 46px; padding: 0 22px; font-size: 16px; }
.me-burger { display: none; width: 46px; height: 46px; position: relative; }
.me-burger span {
  position: absolute; left: 11px; right: 11px; height: 2px; background: var(--me-paper);
  transition: transform 300ms var(--me-ease-out), opacity 200ms ease;
}
.me-burger span:nth-child(1) { top: 16px; }
.me-burger span:nth-child(2) { top: 22px; }
.me-burger span:nth-child(3) { top: 28px; }
.me-burger[aria-expanded="true"] span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
.me-burger[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
.me-burger[aria-expanded="true"] span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

.me-menu {
  position: fixed; inset: 0; z-index: 899;
  background: var(--me-ground);
  padding: calc(var(--me-header-h) + 24px) var(--me-gutter) 32px;
  display: flex; flex-direction: column; gap: 28px;
  overflow-y: auto;
  clip-path: inset(0 0 100% 0);
  visibility: hidden;
  transition: clip-path 520ms var(--me-ease-in-out), visibility 0s linear 520ms;
}
.me-menu.is-open { clip-path: inset(0 0 0 0); visibility: visible; transition: clip-path 520ms var(--me-ease-in-out); }
.me-menu nav { display: flex; flex-direction: column; }
.me-menu nav a {
  font-family: var(--me-display); font-weight: 700; text-transform: uppercase;
  font-size: clamp(36px, 10vw, 56px); line-height: 1.12;
  border-bottom: 1px solid var(--me-line); padding: 6px 0;
}
.me-menu__phones { display: grid; gap: 6px; font-size: 18px; }
.me-menu .me-btn { width: 100%; }

@media (max-width: 1540px) { .me-header__franchise { display: none; } }
@media (max-width: 1340px) { .me-nav { gap: 16px; } .me-nav a { font-size: 14px; } }
@media (max-width: 1500px) { .me-nav a[href="/news"], .me-nav a[href="/shop"] { display: none; } }
@media (max-width: 1080px) {
  .me-nav { display: none; }
  .me-header__in { justify-content: space-between; }
  .me-burger { display: block; }
}
.me-show-s { display: none; }
@media (max-width: 560px) {
  :root { --me-header-h: 64px; }
  .me-header__in { gap: 10px; }
  .me-header__side { gap: 6px; }
  .me-header__logo img { height: 28px; }
  .me-header .me-btn { padding: 0 14px; font-size: 15px; min-height: 40px; }
  .me-hide-s { display: none; }
  .me-show-s { display: inline; }
}
@media (max-width: 380px) {
  .me-header .me-btn { display: none; }
}

/* ---------- Section rhythm ---------- */
.me-section { padding-block: clamp(88px, 11vw, 160px); position: relative; }
.me-section--tight { padding-block: clamp(64px, 8vw, 112px); }
.me-section__head {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 32px;
  margin-bottom: clamp(40px, 5vw, 72px);
  flex-wrap: wrap;
}
.me-rule { border: 0; border-top: 1px solid var(--me-line); margin: 0; }

/* Reveal — exponential ease-out from an already visible default */
.me-reveal { opacity: 1; }
.me.is-ready .me-reveal:not(.is-in) { opacity: 0; transform: translateY(28px); }
.me-reveal {
  transition: opacity 900ms var(--me-ease-out), transform 900ms var(--me-ease-out);
  transition-delay: calc(var(--d, 0) * 80ms);
}

/* ---------- Rails (horizontal scroll-snap sliders) ---------- */
.me-rail {
  display: grid; grid-auto-flow: column;
  grid-auto-columns: var(--rail-col, minmax(300px, 1fr));
  gap: 20px;
  overflow-x: auto; overscroll-behavior-x: contain;
  scroll-snap-type: x mandatory; scroll-padding-inline: var(--me-gutter);
  padding-inline: var(--me-gutter);
  margin-inline: calc(var(--me-gutter) * -1);
  padding-bottom: 8px;
  scrollbar-width: none;
}
.me-rail::-webkit-scrollbar { display: none; }
.me-rail > * { scroll-snap-align: start; }

/* ---------- Trial CTA band ---------- */
.me-cta {
  position: relative; overflow: hidden;
  background: var(--me-red);
  color: #fff;
}
.me-cta__in {
  display: grid; grid-template-columns: 1.3fr 1fr; gap: 48px; align-items: end;
  padding-block: clamp(72px, 9vw, 128px);
}
.me-cta__title {
  font-family: var(--me-display); font-weight: 700; text-transform: uppercase;
  font-size: clamp(52px, 8.4vw, 128px); line-height: 0.88; letter-spacing: -0.01em;
}
.me-cta__side { display: grid; gap: 28px; justify-items: start; }
.me-cta__side p { font-size: 19px; max-width: 34ch; }
.me-cta__phones { display: grid; gap: 4px; font-family: var(--me-display); font-size: 26px; font-weight: 600; letter-spacing: 0.02em; }
.me-cta__phones a { transition: opacity 200ms ease; }
@media (hover: hover) and (pointer: fine) { .me-cta__phones a:hover { opacity: 0.75; } }
.me-cta .me-btn { --btn-bg: var(--me-ground); box-shadow: 0 16px 40px -16px rgba(0,0,0,0.6); }
.me-cta .me-btn::before { background: #000; }
.me-cta__ring {
  position: absolute; right: -12vw; top: 50%; width: 52vw; aspect-ratio: 1;
  translate: 0 -50%;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.18);
  box-shadow: 0 0 0 5vw rgba(255,255,255,0.05), 0 0 0 10vw rgba(255,255,255,0.03);
  pointer-events: none;
}
@media (max-width: 860px) {
  .me-cta__in { grid-template-columns: 1fr; }
}

/* ---------- Join (vacancy / franchise) ---------- */
.me-join { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.me-join__item {
  position: relative; overflow: hidden; border-radius: 6px;
  background: var(--me-ground-2);
  min-height: 340px; padding: clamp(28px, 3vw, 44px);
  display: flex; flex-direction: column; justify-content: space-between; gap: 28px;
  box-shadow: inset 0 0 0 1px var(--me-line);
  transition: transform 300ms var(--me-ease-out), box-shadow 300ms ease;
}
.me-join__item h3 { position: relative; z-index: 1; max-width: 12ch; }
.me-join__item .me-link { position: relative; z-index: 1; color: var(--me-red-hot); }
.me-join__item img {
  position: absolute; right: -4%; bottom: 0; height: 92%; width: auto; max-width: 62%;
  object-fit: contain; object-position: bottom right;
  transition: transform 600ms var(--me-ease-out);
}
@media (hover: hover) and (pointer: fine) {
  .me-join__item:hover { transform: translateY(-2px); box-shadow: inset 0 0 0 1px var(--me-line-strong); }
  .me-join__item:hover img { transform: scale(1.03); }
}
@media (max-width: 760px) {
  .me-join { grid-template-columns: 1fr; }
  .me-join__item img { max-width: 52%; height: 80%; }
}

/* ---------- Footer ---------- */
.me-footer { background: #070708; padding-top: clamp(72px, 8vw, 112px); }
.me-footer__top {
  display: grid; grid-template-columns: 1.2fr repeat(3, 1fr); gap: 40px;
  padding-bottom: 56px;
}
.me-footer__brand img { height: 52px; width: auto; margin-bottom: 24px; }
.me-footer__brand p { color: var(--me-muted); font-size: 15px; max-width: 28ch; }
.me-footer__phones { margin-top: 24px; display: grid; gap: 4px; font-family: var(--me-display); font-size: 22px; font-weight: 600; letter-spacing: 0.02em; }
.me-footer h4 {
  margin: 0 0 18px; font-family: var(--me-display); font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.08em; font-size: 15px; color: var(--me-muted);
}
.me-footer ul { display: grid; gap: 10px; }
.me-footer ul a { font-size: 16px; opacity: 0.86; transition: opacity 200ms ease, color 200ms ease; }
@media (hover: hover) and (pointer: fine) {
  .me-footer ul a:hover { opacity: 1; color: var(--me-red-hot); }
  .me-footer__phones a:hover { color: var(--me-red-hot); }
}
.me-footer__word {
  font-family: var(--me-display); font-weight: 700; text-transform: uppercase;
  font-size: 11.4vw; line-height: 0.78; letter-spacing: -0.02em;
  color: var(--me-ground-3);
  white-space: nowrap; text-align: center;
  user-select: none; overflow: hidden; padding-top: 0.06em;
}
.me-footer__bottom {
  display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap;
  padding-block: 24px; border-top: 1px solid var(--me-line);
  font-size: 14px; color: var(--me-muted);
}
.me-footer__bottom a { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--me-line-strong); }
@media (max-width: 960px) {
  .me-footer__top { grid-template-columns: 1fr 1fr; }
  .me-footer__brand { grid-column: 1 / -1; }
}
@media (max-width: 520px) {
  .me-footer__top { grid-template-columns: 1fr; }
}

   Tilda T702 popups restyle (forms stay native Tilda: заявки, CRM, почта)

/* ---------- Reduced motion ---------- */
@media (prefers-reduced-motion: reduce) {
  .me *, .me *::before, .me *::after {

    transition-duration: 1ms !important; transition-delay: 0ms !important;

<script>
/* Мир единоборств — общие скрипты: шапка, мобильное меню, появление блоков, слайдеры-ленты, аккордеоны */
(function () {
  if (window.__meShared) return;
  window.__meShared = true;
  /* Блок шапки стоит в Tilda раньше контента страницы — ждём, пока документ соберётся */
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
  function init() {
  var root = document;

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- Header: solid on scroll, hide on scroll down ---------- */
  var header = root.querySelector('[data-me-header]');
  var lastY = window.scrollY;
  var ticking = false;
  function onScroll() {
    var y = window.scrollY;
    if (header) {
      header.classList.toggle('is-solid', y > 24);
      var menuOpen = menu && menu.classList.contains('is-open');
      header.classList.toggle('is-hidden', !menuOpen && y > 480 && y > lastY + 4);
      if (y < lastY - 4) header.classList.remove('is-hidden');
      document.documentElement.classList.toggle('me-header-hidden', header.classList.contains('is-hidden'));
    }
    lastY = y;
    ticking = false;
  }
  window.addEventListener('scroll', function () {
    if (!ticking) { requestAnimationFrame(onScroll); ticking = true; }
  }, { passive: true });

  /* ---------- Mobile menu ---------- */
  var burger = root.querySelector('[data-me-burger]');
  var menu = root.querySelector('[data-me-menu]');
  function setMenu(open) {
    if (!menu || !burger) return;
    menu.classList.toggle('is-open', open);
    burger.setAttribute('aria-expanded', String(open));
    burger.setAttribute('aria-label', open ? 'Закрыть меню' : 'Открыть меню');
    document.documentElement.style.overflow = open ? 'hidden' : '';
    if (open) header.classList.add('is-solid');
  }
  if (burger) burger.addEventListener('click', function () { setMenu(!menu.classList.contains('is-open')); });
  if (menu) menu.addEventListener('click', function (e) { if (e.target.closest('a')) setMenu(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && menu && menu.classList.contains('is-open')) { setMenu(false); burger.focus(); } });

  /* Current page in nav */
  var path = location.pathname.replace(/\/$/, '') || '/';
  root.querySelectorAll('.me-nav a').forEach(function (a) {
    if (a.getAttribute('href') === path) a.setAttribute('aria-current', 'page');
  });

  /* ---------- Reveal on scroll ---------- */
  var reveals = root.querySelectorAll('.me-reveal');
  /* Проверка по скроллу, а не IntersectionObserver: при прыжке по якорю блок,
     пролетевший мимо экрана, тоже должен проявиться */
  if (!reduce) {
    var pending = Array.prototype.slice.call(reveals);
    document.querySelectorAll('.me').forEach(function (el) { el.classList.add('is-ready'); });
    var rTick = false;
    var check = function () {
      rTick = false;
      var limit = window.innerHeight * 0.92;
      pending = pending.filter(function (el) {
        if (el.getBoundingClientRect().top < limit) { el.classList.add('is-in'); return false; }
        return true;
      });
      if (!pending.length) { window.removeEventListener('scroll', onRevealScroll); window.removeEventListener('resize', onRevealScroll); }
    };
    var onRevealScroll = function () { if (!rTick) { rTick = true; requestAnimationFrame(check); } };
    window.addEventListener('scroll', onRevealScroll, { passive: true });
    window.addEventListener('resize', onRevealScroll);
    check();
  }

  /* ---------- Rails (coaches, reviews, gallery) ---------- */
  root.querySelectorAll('[data-me-rail-wrap]').forEach(function (wrap) {
    var rail = wrap.querySelector('[data-me-rail]');
    var prev = wrap.querySelector('[data-me-rail-prev]');
    var next = wrap.querySelector('[data-me-rail-next]');
    if (!rail) return;
    function step() {
      var item = rail.children[0];
      if (!item) return rail.clientWidth;
      var gap = parseFloat(getComputedStyle(rail).columnGap) || 0;
      return (item.getBoundingClientRect().width + gap) * Math.max(1, Math.floor(rail.clientWidth / (item.getBoundingClientRect().width + gap)));
    }
    function update() {
      var max = rail.scrollWidth - rail.clientWidth - 2;
      if (prev) prev.disabled = rail.scrollLeft <= 2;
      if (next) next.disabled = rail.scrollLeft >= max;
    }
    if (prev) prev.addEventListener('click', function () { rail.scrollBy({ left: -step(), behavior: reduce ? 'auto' : 'smooth' }); });
    if (next) next.addEventListener('click', function () { rail.scrollBy({ left: step(), behavior: reduce ? 'auto' : 'smooth' }); });
    rail.addEventListener('scroll', function () { requestAnimationFrame(update); }, { passive: true });
    window.addEventListener('resize', update);
    update();
  });

  /* ---------- Accordions: smooth height for <details> ---------- */
  root.querySelectorAll('details.me-acc').forEach(function (d) {
    var summary = d.querySelector('summary');
    var body = d.querySelector('.me-acc__body');
    if (!summary || !body || reduce) return;
    summary.addEventListener('click', function (e) {
      e.preventDefault();
      if (d.dataset.anim) return;
      d.dataset.anim = '1';
      if (!d.open) {
        d.open = true;
        var h = body.scrollHeight;
        body.animate([{ height: '0px', opacity: 0 }, { height: h + 'px', opacity: 1 }], { duration: 420, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' })
          .onfinish = function () { delete d.dataset.anim; };
      } else {
        var h2 = body.scrollHeight;
        body.animate([{ height: h2 + 'px', opacity: 1 }, { height: '0px', opacity: 0 }], { duration: 320, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' })
          .onfinish = function () { d.open = false; delete d.dataset.anim; };
      }
    });
  });
  }
})();

</script>
